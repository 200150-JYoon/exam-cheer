<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공주의 시험 응원판</title>
<meta name="description" content="공주야, 오늘도 한 칸 채워 볼까? 엄마가 응원해!">
<meta property="og:title" content="공주의 시험 응원판 💪">
<meta property="og:description" content="남은 시험 일정이랑 엄마의 오늘 한마디 보러 가자!">
<meta name="theme-color" content="#ff6b8b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff7ec;
    --card: #ffffff;
    --ink: #3b2a45;
    --soft: #8a7a93;
    --pink: #ff6b8b;
    --pink-soft: #ffe1e8;
    --sun: #ffc93c;
    --sun-soft: #fff1c7;
    --mint: #3cc9a5;
    --mint-soft: #d8f6ec;
    --sky: #5aa9ff;
    --line: #f1e4d6;
    --radius: 22px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(circle at 12% 8%, var(--sun-soft) 0 90px, transparent 91px),
      radial-gradient(circle at 92% 22%, var(--pink-soft) 0 70px, transparent 71px);
    background-repeat: no-repeat;
    color: var(--ink);
    font-family: "Gowun Dodum", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px 48px; }
  h1, h2, .jua { font-family: "Jua", "Gowun Dodum", sans-serif; font-weight: 400; }
  h2 { font-size: 20px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }

  .hello { text-align: center; padding: 8px 0 20px; }
  .hello .crown { font-size: 40px; display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  .hello h1 { font-size: 26px; margin: 6px 0 0; }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(-6deg); } }

  .dday {
    background: var(--pink);
    color: #fff;
    border-radius: var(--radius);
    padding: 22px 20px;
    text-align: center;
    box-shadow: 0 8px 0 #e44f71;
    margin-bottom: 26px;
  }
  .dday .big { font-family: "Jua", sans-serif; font-size: 56px; line-height: 1; letter-spacing: 1px; }
  .dday .sub { margin-top: 8px; font-size: 17px; }

  .card {
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 18px;
  }

  .note {
    background: var(--sun-soft);
    border: 2px dashed var(--sun);
    position: relative;
  }
  .note .msg { font-family: "Jua", sans-serif; font-size: 21px; line-height: 1.5; margin: 0; word-break: keep-all; white-space: pre-line; }
  .note .from { text-align: right; color: var(--soft); margin: 10px 0 0; }

  .exams { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .exam {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 14px; border-radius: 16px;
    background: var(--mint-soft);
  }
  .exam .date { font-family: "Jua", sans-serif; font-size: 18px; min-width: 76px; }
  .exam .subj { flex: 1; font-size: 17px; }
  .exam .tag { font-family: "Jua", sans-serif; font-size: 14px; padding: 3px 10px; border-radius: 999px; background: #fff; white-space: nowrap; }
  .exam.today { background: var(--pink-soft); outline: 3px solid var(--pink); }
  .exam.past { opacity: .45; }
  .exam.past .subj { text-decoration: line-through; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 16px; }
  .chip {
    font: inherit; font-size: 16px;
    padding: 9px 16px; border-radius: 999px;
    border: 2px solid var(--line); background: #fff; color: var(--ink);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .chip[aria-pressed="true"] { background: var(--sky); border-color: var(--sky); color: #fff; }
  label.lbl { display: block; font-family: "Jua", sans-serif; font-size: 16px; margin-bottom: 6px; }
  .mood {
    width: 100%; font: inherit; font-size: 18px;
    padding: 12px 14px; border-radius: 14px;
    border: 2px solid var(--line); background: #fff; color: var(--ink);
  }
  .mood:focus, .chip:focus-visible, .go:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  .go {
    width: 100%; margin-top: 16px;
    font-family: "Jua", sans-serif; font-size: 20px;
    padding: 14px; border: 0; border-radius: 16px;
    background: var(--mint); color: #fff;
    box-shadow: 0 5px 0 #2aa686; cursor: pointer;
  }
  .go:active { transform: translateY(3px); box-shadow: 0 2px 0 #2aa686; }
  .go:disabled { background: #b9e9db; box-shadow: none; transform: none; cursor: default; }
  .chip:disabled, .mood:disabled { opacity: .75; cursor: default; }
  .hint { color: var(--soft); font-size: 14px; margin: 10px 0 0; min-height: 1.4em; }
  .hint.ok { color: var(--mint); font-family: "Jua", sans-serif; font-size: 16px; }
  .hint.err { color: var(--pink); }

  .count { font-family: "Jua", sans-serif; text-align: center; margin: 0 0 12px; }
  .logs { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .log { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 16px; background: var(--bg); }
  .log .stk {
    flex: none; width: 52px; height: 52px; border-radius: 14px;
    background: var(--sun-soft); display: grid; place-items: center; font-size: 30px;
  }
  .log.pop .stk { animation: pop .5s ease; }
  @keyframes pop { 0% { transform: scale(.2); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
  .log .txt { min-width: 0; }
  .log .when { font-family: "Jua", sans-serif; font-size: 15px; color: var(--soft); }
  .log .what { font-size: 16px; word-break: keep-all; }
  .log .feel { display: inline-block; margin-top: 2px; padding: 1px 10px; border-radius: 999px; background: var(--pink-soft); font-size: 14px; }
  .empty { color: var(--soft); text-align: center; margin: 0; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<main class="wrap">

  <header class="hello">
    <span class="crown" aria-hidden="true">👑</span>
    <h1 id="hello">공주야, 오늘도 한 칸 채워 볼까?</h1>
  </header>

  <section class="dday" aria-live="polite">
    <div class="big" id="ddayBig">D-?</div>
    <div class="sub" id="ddaySub"></div>
  </section>

  <section class="card note">
    <h2>💌 엄마의 오늘 한마디</h2>
    <p class="msg" id="msg"></p>
    <p class="from">— 엄마가</p>
  </section>

  <section class="card">
    <h2>📅 남은 시험 일정</h2>
    <ul class="exams" id="exams"></ul>
  </section>

  <section class="card">
    <h2>✏️ 오늘 기록 남기기</h2>
    <form id="form" autocomplete="off">
      <span class="lbl" id="subjLbl">오늘 공부한 과목 (여러 개 골라도 돼)</span>
      <div class="chips" id="chips" role="group" aria-labelledby="subjLbl"></div>
      <label class="lbl" for="mood">오늘 기분 한 단어</label>
      <input class="mood" id="mood" maxlength="10" placeholder="예: 뿌듯, 졸려, 할만해">
      <button class="go" type="submit">오늘 기록 남기기 ✨</button>
      <p class="hint" id="hint" aria-live="polite"></p>
    </form>
  </section>

  <section class="card">
    <h2>🌟 칭찬 스티커판</h2>
    <p class="count" id="count"></p>
    <ul class="logs" id="logs"></ul>
  </section>

</main>

<script>
  // ===== 엄마가 바꾸는 곳 =====
  const NICKNAME = "공주";
  // 날짜별 한마디: 그날이 되면 그날 문장이 나오고, 적어 두지 않은 날에는 MESSAGE 가 나온다
  const MESSAGES = {
    "2026-10-26": `우리 공주, 드디어 내일부터 시험이네. 내일부터 시작되는 기말고사! 최선을 다하렴.
그리고 과정에 정성을 다한 너를 격하게 칭찬해 주렴.
오늘은 너무 늦게 까지 공부하지 말고 푹 자. 엄마가 기도하고 있을게.`,
    "2026-10-27": `첫날이다, 우리 공주! 국어·사회~ 아는 것부터 차근차근 풀면 돼.
끝까지 남기지 않고 노력해 보렴! 그래야 결과가 어떻든 후회하지 않는거야.
엄마는 언제나 우리 공주 편~ 사랑해, 우리 공주^^`,
    "2026-10-28": `수학은 천천히 꼼꼼하고 겸손하게 풀 것, 역사는 외운 걸 믿고..
어제 시험은 어제에 두고 오늘에만 집중하자.
우리 공주! 할 수 있어.`,
    "2026-10-29": `드디어 마지막 날! 영어·과학! 우리 공주! 끝까지 정성을 다하렴.
오늘 마지막 종이 울리면 그동안 정성을 다한 너에게 엄마가 큰 박수 보낼게.
정말 수고 많았어. 우리 공주^^`,
    "2026-10-30": `공주야, 마지막 시험 끝까지 해낸 거 정말 대단해.
결과보다 끝까지 최선을 다한 네가 더 멋져. 오늘은 마음껏 쉬어.`,
  };
  const MESSAGE = "우리 공주! 공주가 얼마나 애쓰는지 엄마가 다 알고 있어. 다른 사람은 몰라도 엄마는 다 알고 있지. 넌 진짜 멋진 아이이고, 네 삶의 주인공이야. 마지막 시험, 최선을 다해서 끝까지 잘 마무리 하렴.";
  const EXAMS = [
    { date: "2026-10-27", subjects: ["국어", "사회"] },
    { date: "2026-10-28", subjects: ["수학", "역사"] },
    { date: "2026-10-29", subjects: ["영어", "과학"] },
  ];
  // ============================

  const STORE_KEY = "exam-cheer-logs";
  const STICKERS = ["⭐", "🌈", "🍓", "🐰", "🌻", "🦄", "🍀", "🎀", "🐥", "💖"];
  const DAYS = ["일", "월", "화", "수", "목", "금", "토"];
  const $ = (id) => document.getElementById(id);

  function ymd(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function parse(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
  function label(s) { const d = parse(s); return (d.getMonth() + 1) + "/" + d.getDate() + "(" + DAYS[d.getDay()] + ")"; }
  function daysBetween(a, b) { return Math.round((parse(b) - parse(a)) / 86400000); }

  const today = ymd(new Date());

  // 엄마 한마디
  $("msg").textContent = MESSAGES[today] || MESSAGE;
  $("hello").textContent = NICKNAME + "야, 오늘도 한 칸 채워 볼까?";

  // D-day
  const next = EXAMS.find((e) => e.date >= today);
  if (!next) {
    $("ddayBig").textContent = "시험 끝! 🎉";
    $("ddaySub").textContent = NICKNAME + "야, 정말 수고 많았어. 오늘은 푹 쉬자!";
  } else {
    const n = daysBetween(today, next.date);
    if (n === 0) {
      $("ddayBig").textContent = "D-DAY";
      $("ddaySub").textContent = "오늘은 " + next.subjects.join("·") + " 시험! 할 수 있어 💪";
    } else {
      $("ddayBig").textContent = "D-" + n;
      $("ddaySub").textContent = label(next.date) + " " + next.subjects.join("·") + " 시험까지";
    }
  }

  // 시험 일정
  $("exams").innerHTML = "";
  EXAMS.forEach((e) => {
    const li = document.createElement("li");
    const n = daysBetween(today, e.date);
    li.className = "exam" + (n < 0 ? " past" : n === 0 ? " today" : "");
    li.innerHTML = '<span class="date"></span><span class="subj"></span><span class="tag"></span>';
    li.querySelector(".date").textContent = label(e.date);
    li.querySelector(".subj").textContent = e.subjects.join(", ");
    li.querySelector(".tag").textContent = n < 0 ? "끝! 👏" : n === 0 ? "오늘" : "D-" + n;
    $("exams").appendChild(li);
  });

  // 기록 (이 폰 안에만 저장) — 하루 한 번, 기록하면 스티커 하나
  function loadLogs() {
    let data;
    try { data = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { data = null; }
    if (Array.isArray(data)) return data;
    if (data && typeof data === "object") {
      // 예전 방식(하루 한 칸)으로 남긴 기록도 그대로 보여 준다
      return Object.keys(data).sort().map((d) => ({ date: d, time: "", subjects: data[d].subjects, mood: data[d].mood }));
    }
    return [];
  }
  function saveLogs(logs) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(logs)); return true; } catch (e) { return false; }
  }
  // 엄마용: 주소 끝에 ?reset 을 붙여 열면 이 기기에 저장된 기록을 지운다
  if (new URLSearchParams(location.search).has("reset")) {
    if (confirm("이 기기에 저장된 기록과 스티커를 모두 지울까요?")) {
      try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    }
    history.replaceState(null, "", location.pathname);
  }

  function stickerFor(i) { return STICKERS[(i * 7) % STICKERS.length]; }
  function nowTime() { const d = new Date(); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }

  const allSubjects = [...new Set(EXAMS.flatMap((e) => e.subjects))];
  allSubjects.forEach((s) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = s;
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true"));
    $("chips").appendChild(b);
  });

  // 기록은 하루에 한 번만: 오늘 기록이 있으면 칸을 잠근다
  function lockToday() {
    const t = loadLogs().filter((l) => l.date === today).pop();
    if (!t) return false;
    $("mood").value = t.mood;
    $("mood").disabled = true;
    document.querySelectorAll(".chip").forEach((c) => {
      c.setAttribute("aria-pressed", t.subjects.includes(c.textContent) ? "true" : "false");
      c.disabled = true;
    });
    const go = document.querySelector(".go");
    go.disabled = true;
    go.textContent = "오늘 기록 완료 ✅";
    return true;
  }

  function renderBoard(popIndex) {
    const logs = loadLogs();
    $("count").textContent = logs.length ? "지금까지 스티커 " + logs.length + "개! 🎉" : "하루에 한 번 기록하면 스티커가 하나씩 붙어!";
    $("logs").innerHTML = "";
    if (!logs.length) {
      const p = document.createElement("li");
      p.className = "empty";
      p.textContent = "아직 기록이 없어. 오늘 첫 스티커를 붙여 보자!";
      $("logs").appendChild(p);
      return;
    }
    // 새 기록이 맨 위, 스티커 옆에 그때 남긴 기록
    for (let i = logs.length - 1; i >= 0; i--) {
      const l = logs[i];
      const li = document.createElement("li");
      li.className = "log" + (i === popIndex ? " pop" : "");
      li.innerHTML = '<span class="stk" aria-hidden="true"></span><div class="txt"><div class="when"></div><div class="what"></div><span class="feel"></span></div>';
      li.querySelector(".stk").textContent = stickerFor(i);
      li.querySelector(".when").textContent = label(l.date) + (l.time ? " " + l.time : "");
      li.querySelector(".what").textContent = l.subjects.join(", ");
      li.querySelector(".feel").textContent = "기분 · " + l.mood;
      $("logs").appendChild(li);
    }
  }

  $("form").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const subjects = [...document.querySelectorAll('.chip[aria-pressed="true"]')].map((c) => c.textContent);
    const mood = $("mood").value.trim();
    const hint = $("hint");
    if (!subjects.length) { hint.className = "hint err"; hint.textContent = "공부한 과목을 하나 이상 골라 줘!"; return; }
    if (!mood) { hint.className = "hint err"; hint.textContent = "기분을 한 단어로 적어 줘!"; $("mood").focus(); return; }
    const logs = loadLogs();
    if (logs.some((l) => l.date === today)) { lockToday(); return; }
    logs.push({ date: today, time: nowTime(), subjects, mood });
    if (!saveLogs(logs)) { hint.className = "hint err"; hint.textContent = "이 브라우저에서는 저장이 안 돼. 다른 브라우저로 열어 줄래?"; return; }
    const i = logs.length - 1;
    lockToday();
    hint.className = "hint ok";
    hint.textContent = "잘했어 " + NICKNAME + "야! 스티커 하나 붙였어 " + stickerFor(i) + " 내일 또 만나!";
    renderBoard(i);
  });

  if (lockToday()) {
    $("hint").className = "hint ok";
    $("hint").textContent = "오늘 기록은 끝! 내일 또 한 칸 채우자 ✨";
  }
  renderBoard();
</script>
</body>
</html>
